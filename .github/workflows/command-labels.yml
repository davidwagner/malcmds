name: Command AI labels
on:
  pull_request:
    paths:
      - 'scripts/label_commands'
      - 'scripts/import_labels'
      - 'scripts/_command_labels.py'
      - 'tests/test_command_labels.py'
      - '.github/workflows/command-labels.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.6 httpx==0.28.1 tqdm==4.67.1 pytest pytest-xdist
      - run: python -m pytest -q -n auto tests/test_command_labels.py
