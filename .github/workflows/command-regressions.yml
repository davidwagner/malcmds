name: Command parsing regressions
on:
  pull_request:
    paths: ['datasets/**', 'scripts/**', 'tests/**', '.github/workflows/command-regressions.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ingest-requirements.txt pytest uv
      - run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full
      - run: python -m pytest -q tests/test_carbon_black_escaping.py tests/test_rendered_records.py tests/test_osquery_sessions.py tests/test_aviator_encoding.py tests/test_documented_attacks.py
      - name: Preserve AVIATOR serial filtering and ZIP decoder assumptions
        run: python -m pytest -q tests/test_ingest_aviator_speed.py tests/test_ingest_aviator_parallel.py
      - name: Preserve observation tables and DuckDB migration assumptions
        run: >-
          python -m pytest -q tests/test_observation_tables.py
          tests/test_migrate_observations.py tests/test_migration_reingest.py
          tests/test_remove_dataset.py
          tests/test_migrate_honeypot_labels.py
          tests/test_shell_input_observations.py
      - name: Preserve PublicArena network paths and PAExec attack labels
        run: python -m pytest -q tests/test_publicarena_paths.py
      - name: Preserve CyberLab observations and copied-event filtering
        run: >-
          python -m pytest -q tests/test_cyberlab_deduplication.py
          tests/test_ingest_cyberlab_regressions.py
      - name: Check script locations and dataset entry points
        run: python -m pytest -q tests/test_directory_layout.py
      - name: Preserve six-worker parsing and global process selection
        timeout-minutes: 5
        run: >-
          python -u -m pytest -vv --durations=10
          tests/test_ingest_six_workers.py tests/test_comiset_annotations.py
          tests/test_ingest_timeout.py
