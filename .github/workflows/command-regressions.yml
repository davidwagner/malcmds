name: Command parsing regressions
on:
  pull_request:
    paths: ['datasets/**', '.github/workflows/command-regressions.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r datasets/ingest-requirements.txt pytest
      - run: python -m pytest -q datasets/test_carbon_black_escaping.py
