name: AI classifier evaluation
on:
  pull_request:
    paths:
      - 'scripts/eval_ai_classifiers'
      - 'scripts/_eval_ai_*.py'
      - 'tests/test_eval_ai_classifiers.py'
      - 'tests/fixtures/eval-ai/**'
      - '.github/workflows/eval-ai-classifiers.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.6 httpx==0.28.1 pytest python-dotenv==1.2.2
      - run: python -m pytest -q tests/test_eval_ai_classifiers.py
