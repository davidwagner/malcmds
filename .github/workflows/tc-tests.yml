name: TC native ingestion regressions
on:
  pull_request:
    paths: ['datasets/**', '.github/workflows/tc-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r datasets/ingest-requirements.txt pytest
      - name: Preserve bounded reads and committed prefixes on malformed input
        run: >-
          python -m pytest -q
          datasets/test_ingest_tc_parallel.py::test_limit_closes_reader_before_unread_corrupt_file
          datasets/test_ingest_tc_parallel.py::test_failed_scan_cleans_workers_and_preserves_committed_batch
      - run: python -m pytest -q datasets/test_tc_fixtures.py
