name: Public dataset ingestion
on:
  pull_request:
    paths: ['datasets/**', 'scripts/**', 'tests/**', 'schema.md', '.github/workflows/public-dataset-tests.yml']
  push:
    branches: [main]
    paths: ['datasets/**', 'scripts/**', 'tests/**', 'schema.md', '.github/workflows/public-dataset-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python ingestion dependencies
        run: python -m pip install -r scripts/ingest-requirements.txt pytest
      - name: Install PostgreSQL 17 archive reader
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Preserve native BOTS persistence labels and command parsing
        run: python -m pytest -q tests/test_bots_persistence.py
      - name: Fetch pinned LADE sources and portable parser
        run: python datasets/lade/fetch
      - name: Check native parsers and ingestion
        env:
          PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
        run: |
          "$PG_RESTORE" --version
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python -m pytest -q tests/test_ingest_audit_sessions.py tests/test_ingest_audit_titles.py tests/test_ingest_executions.py tests/test_ingest_bots_labels.py tests/test_ingest_bots_osquery.py tests/test_ingest_sudo.py tests/test_ingest_bots_ps.py tests/test_ingest_shell_fields.py tests/test_ingest_quasarnix_honeypot.py tests/test_ingest_public_errors.py tests/test_ingest_acme_autolabel.py tests/test_ingest_autolabel_json.py tests/test_ingest_autolabel_shell.py tests/test_ingest_autolabel_parallel.py tests/test_ingest_carbanak.py tests/test_ingest_lade_otrf.py tests/test_ingest_lade_formats.py tests/test_ingest_otrf_formats.py tests/test_ingest_tracking.py tests/test_atlas_browser_labels.py tests/test_windows_apt_decoding.py tests/test_windows_apt_labels.py tests/test_honeypot_labels.py tests/test_bots_shell_fields.py tests/test_complete_shell_input.py tests/test_comiset_annotations.py tests/test_adgen.py
